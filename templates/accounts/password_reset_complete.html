{% extends 'base.html' %}

{% block title %}Password Reset Complete — ShopEase{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-icon">✅</div>
        <h2>Password Reset Successful!</h2>
        <p class="form-subtitle">Your password has been changed. You can now log in with your new password.</p>

        <div class="form-actions" style="margin-top: 2rem;">
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">Go to Login</a>
        </div>
    </div>
</div>
{% endblock %}
