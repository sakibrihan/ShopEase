{% extends 'base.html' %}

{% block title %}Login — ShopEase{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h2>Welcome Back</h2>
        <p class="form-subtitle">Login to your ShopEase account</p>

        <form method="POST" action="{% url 'accounts:login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control"
                    placeholder="Enter your password" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>

        <div class="form-footer" style="margin-bottom: 0.5rem;">
            <a href="{% url 'accounts:password_reset' %}" class="forgot-password-link">Forgot Password?</a>
        </div>

        <div class="form-footer">
            Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
